    }

    /* Smooth Fade Animation */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-view {
      animation: fadeSlideUp 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes watermarkDrift {

      75% { top: 18%; right: 60%; }
      100% { top: 14%; right: 10%; }

    .video-watermark {
      animation: watermarkDrift 28s infinite ease-in-out;
      pointer-events: none;
      user-select: none;

    input[type="range"].apple-slider {

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const id = 'toast-' + Date.now();
      const colors = {
        success: 'bg-[#1D1D1F] text-white border-emerald-500/40',
        error: 'bg-[#1D1D1F] text-white border-rose-500/40',
        info: 'bg-[#1D1D1F] text-white border-sky-500/40'
      };
      const icons = {
        success: '<i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400 shrink-0"></i>',
        error: '<i data-lucide="alert-circle" class="w-5 h-5 text-rose-400 shrink-0"></i>',
        info: '<i data-lucide="info" class="w-5 h-5 text-sky-400 shrink-0"></i>'
      };

      const el = document.createElement('div');
      el.id = id;
      el.className = `pointer-events-auto flex items-center gap-3 px-4 py-3.5 rounded-2xl shadow-xl border ${colors[type] || colors.info} animate-view text-sm font-medium`;
      el.innerHTML = `${icons[type] || icons.info}<span>${message}</span>`;
      container.appendChild(el);
      lucide.createIcons();

      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(8px)';
        el.style.transition = 'all 0.25s ease';
        setTimeout(() => el.remove(), 250);
      }, 3400);
    }

    // Simulated Row-Level Security (RLS) Guard
    function enforceRLS(requiredRole) {
      if (!currentUser || currentUser.status !== 'active') {
        showToast('تم رفض الوصول (RLS): الحساب غير نشط أو غير مصرح له', 'error');
        return false;

      if (requiredRole && currentUser.role !== requiredRole) {
        showToast('تم رفض الوصول (RLS): لا تملك صلاحيات هذه الواجهة', 'error');
        return false;
      }
      return true;
    }

      const target = db.users.find(u => u.role === role && u.status === 'active');
      if (!target) {
        showToast('لا يوجد حساب نشط لهذا الدور حاليًا', 'error');
        return;
      }
      currentUser = target;
      activeExamMode = false;
      isPiP = false;
      if (role === 'admin') adminTab = 'overview';
      if (role === 'teacher') {

    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');

    function fillDemoLogin(email) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = '123';

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim().toLowerCase();
      const password = document.getElementById('login-password').value;

      const user = db.users.find(u => u.email.toLowerCase() === email && u.password === password);
      if (!user) {
        showToast('بيانات الدخول غير صحيحة. تأكد من البريد وكلمة المرور.', 'error');
        return;
      }
      if (user.status !== 'active') {
        showToast('هذا الحساب موقوف مؤقتًا من قِبل الإدارة.', 'error');
        return;
      }
      if (!user.verified) {
        pendingVerifyEmail = user.email;
        authViewMode = 'verify';
        renderAuthScreen();
        return;
      }

      currentUser = user;
      showToast(`أهلاً بعودتك، ${user.name}!`, 'success');
      renderApp();
    }

    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim().toLowerCase();
      const password = document.getElementById('reg-password').value;

      if (db.users.some(u => u.email.toLowerCase() === email)) {
        showToast('هذا البريد الإلكتروني مسجل مسبقًا!', 'error');
        return;
      }

      const newUser = {
        id: 'u-student-' + Date.now(),
        name,
        email,
        password,
        role: 'student',
        verified: false,
        status: 'active'
      };
      db.users.push(newUser);
      saveDB();

      pendingVerifyEmail = email;
      authViewMode = 'verify';
      showToast('تم إنشاء الحساب! يرجى تأكيد البريد الإلكتروني.', 'info');
      renderAuthScreen();
    }

    function completeEmailVerification() {
      const code = document.getElementById('verify-code-input').value.trim();
      if (code.length < 4) {
        showToast('يرجى إدخال رمز التحقق المكون من 4 أرقام', 'error');
        return;
      }
      const user = db.users.find(u => u.email === pendingVerifyEmail);
      if (user) {
        user.verified = true;
        saveDB();
        currentUser = user;
        showToast('تم تأكيد البريد الإلكتروني وتفعيل حسابك بنجاح!', 'success');
        renderApp();
      }
    }

    function handlePasswordReset(e) {
      e.preventDefault();
      const email = document.getElementById('reset-email').value.trim().toLowerCase();
      const newPass = document.getElementById('reset-new-pass').value;
      const user = db.users.find(u => u.email.toLowerCase() === email);
      if (!user) {
        showToast('لم يتم العثور على حساب مرتبط بهذا البريد الإلكتروني', 'error');
        return;
      }
      user.password = newPass;
      saveDB();
      showToast('تم تحديث كلمة المرور بنجاح! يمكنك تسجيل الدخول الآن.', 'success');
      authViewMode = 'login';
      renderAuthScreen();
    }

    function submitAddTeacher(e) {
      e.preventDefault();

        showToast('البريد الإلكتروني مستخدم بالفعل', 'error');
        return;
      }
      db.users.push({
        id: 'u-teacher-' + Date.now(),
        name: document.getElementById('t-name').value.trim(),
        specialty: document.getElementById('t-spec').value.trim(),
        email,
        password: document.getElementById('t-pass').value,
        role: 'teacher',

    function saveCourseForm(e, courseId, forceTeacherId) {
      e.preventDefault();
      const title = document.getElementById('c-title').value.trim();
      const description = document.getElementById('c-desc').value.trim();
      const category = document.getElementById('c-cat').value.trim();
      const teacherId = forceTeacherId || document.getElementById('c-teacher').value;
      const isFree = document.getElementById('c-free').value === 'true';
      const published = document.getElementById('c-pub').value === 'true';

      const gradients = [
        'from-[#0071E3] via-[#2997FF] to-[#5AC8FA]',
        'from-[#34C759] via-[#30B0C7] to-[#0071E3]',
        'from-[#AF52DE] via-[#5856D6] to-[#0071E3]',
        'from-[#FF9500] via-[#FF3B30] to-[#AF52DE]'
      ];

      if (courseId) {
        const c = db.courses.find(item => item.id === courseId);
        if (c) {
          c.title = title;
          c.description = description;
          c.category = category;
          c.teacherId = teacherId;
          c.isFree = isFree;
          c.published = published;
        }
        showToast('تم تحديث بيانات الكورس بنجاح', 'success');
      } else {
        db.courses.push({
          id: 'c-' + Date.now(),
          title,
          description,
          category,
          teacherId,
          isFree,
          published,
          coverGradient: gradients[db.courses.length % gradients.length],
          lectures: []
        });
        showToast('تم إنشاء الكورس بنجاح', 'success');
      }

      saveDB();
      closeModal();
      renderApp();
    }

    function submitGenerateCodes(e) {
      e.preventDefault();
      const courseId = document.getElementById('code-course-id').value;
      const count = parseInt(document.getElementById('code-count').value, 10) || 1;
      const prefix = (document.getElementById('code-prefix').value || 'OFOQ').toUpperCase().trim();

      for (let i = 0; i < count; i++) {
        const rand = Math.random().toString(36).substring(2, 7).toUpperCase();
        db.subscriptionCodes.unshift({
          code: `${prefix}-${rand}-${100 + i}`,
          courseId,
          used: false,
          usedByUserId: null,
          usedAt: null,
          createdAt: new Date().toISOString().slice(0, 10)
        });
      }
      saveDB();
      closeModal();
      showToast(`تم توليد ${count} أكواد اشتراك بنجاح!`, 'success');
      renderAdminDashboard();
    }

    function copyTextToClipboard(text) {
      const el = document.createElement('textarea');
      el.value = text;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      showToast(`تم نسخ الكود: ${text}`, 'success');
    }

                      ${lec.exam ? `امتحان مرتبط (${lec.exam.questions.length} أسئلة)` : 'لا يوجد امتحان'}
                    </span>
                  </div>
                </div>

                <div class="flex flex-wrap items-center gap-2 shrink-0">
                  ${perms.canEditLectures ? `

                      تعديل المحاضرة
                    </button>
                  ` : ''}
                  ${perms.canManageExams ? `
                    <button onclick="openExamBuilderModal('${course.id}', '${lec.id}')" class="px-3.5 py-2 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-semibold transition flex items-center gap-1.5">

                    </button>
                  ` : ''}
                </div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (teacherTab === 'essays') {
        contentHtml = `
          <div class="apple-card p-6">
            <h3 class="font-display font-bold text-lg mb-1">تصحيح الأسئلة المقالية للطلاب</h3>
            <p class="text-xs text-[#6E6E73] mb-5">مراجعة إجابات الطلاب المقالية ورصد الدرجات النهائية</p>

            ${essaySubs.length === 0 ? `<p class="text-sm text-[#6E6E73] py-6 text-center">لا توجد إجابات مقالية مقدمة حتى الآن.</p>` : `
              <div class="space-y-4">
                ${essaySubs.map(sub => {
                  const student = db.users.find(u => u.id === sub.userId);
                  const course = db.courses.find(c => c.id === sub.courseId);
                  return `
                    <div class="p-4 rounded-2xl bg-[#F5F5F7] space-y-3">
                      <div class="flex flex-wrap items-center justify-between gap-2">
                        <div>
                          <span class="font-bold text-sm text-[#1D1D1F]">${student ? student.name : 'طالب'}</span>
                          <span class="text-xs text-[#6E6E73] mr-2">• ${course ? course.title : ''}</span>
                        </div>
                        <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-white">الدرجة الحالية: ${sub.totalScore}%</span>
                      </div>
                      ${sub.essayAnswers.map((ea, i) => `
                        <div class="p-3.5 rounded-xl bg-white border border-black/5 space-y-2">
                          <div class="text-xs font-bold text-[#0071E3]">السؤال المقالي: ${ea.questionText}</div>
                          <div class="text-sm text-[#1D1D1F] bg-[#F5F5F7] p-3 rounded-lg">${ea.studentAnswer || 'لم يكتب الطالب إجابة'}</div>
                          <div class="flex items-center gap-2 pt-1">
                            <label class="text-xs font-semibold">تقييم المدرس (من 100):</label>
                            <input type="number" id="grade-${sub.id}-${i}" min="0" max="100" value="${ea.teacherGrade ?? 85}" class="w-20 px-2.5 py-1 rounded-lg bg-[#F5F5F7] text-xs font-bold" />
                            <button onclick="gradeEssaySubmission('${sub.id}', ${i})" class="px-3 py-1.5 rounded-lg bg-[#34C759] text-white text-xs font-bold">اعتماد الدرجة</button>
                          </div>
                        </div>
                      `).join('')}
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        `;
      }

      app.innerHTML = `
        <div class="animate-view">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
            <div>
              <h1 class="text-2xl sm:text-3xl font-display font-extrabold text-[#1D1D1F]">لوحة تحكم المدرس</h1>
              <p class="text-sm text-[#6E6E73] mt-1">مرحباً ${currentUser.name} • التخصص: ${currentUser.specialty || 'التعليم الإلكتروني'}</p>
            </div>
            <div class="segmented-bg inline-flex gap-1">
              <button onclick="teacherTab='courses'; renderTeacherDashboard();" class="px-4 py-2 rounded-xl text-xs font-bold transition ${teacherTab==='courses' ? 'bg-white text-[#1D1D1F] shadow-sm' : 'text-[#6E6E73]'}">الكورسات والمحاضرات</button>
              <button onclick="teacherTab='essays'; renderTeacherDashboard();" class="px-4 py-2 rounded-xl text-xs font-bold transition ${teacherTab==='essays' ? 'bg-white text-[#1D1D1F] shadow-sm' : 'text-[#6E6E73]'}">تصحيح الأسئلة المقالية</button>
            </div>
          </div>
          ${contentHtml}
        </div>
      `;
      lucide.createIcons();
    }

    // Lecture Editor Modal (Video URL, PDF, Chapters, Moments)
    function openLectureModal(courseId, lectureId = null) {
      const course = db.courses.find(c => c.id === courseId);
      if (!course) return;
      const lec = lectureId ? course.lectures.find(l => l.id === lectureId) : null;

      const chaptersText = lec && lec.chapters ? lec.chapters.map(c => `${c.time}|${c.title}`).join('\n') : '0|مقدمة المحاضرة\n15|المحور الرئيسي الأول\n35|الخلاصة والتطبيق';
      const momentsText = lec && lec.moments ? lec.moments.map(m => `${m.time}|${m.label}`).join('\n') : '12|نقطة هامة جدًا للامتحان\n28|مثال تطبيقي عملي';

      openModal(`
        <div class="p-6 max-h-[88vh] overflow-y-auto">
          <div class="flex items-center justify-between pb-4 border-b border-black/5">
            <h3 class="font-display font-bold text-lg">${lec ? 'تعديل بيانات المحاضرة' : 'إضافة محاضرة جديدة'}</h3>
            <button onclick="closeModal()" class="p-1.5 rounded-lg hover:bg-black/5"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>

          <form onsubmit="saveLectureForm(event, '${courseId}', '${lec ? lec.id : ''}')" class="space-y-4 mt-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold mb-1">عنوان المحاضرة</label>
                <input type="text" id="l-title" required value="${lec ? lec.title : ''}" placeholder="مثال: شرح الدوال المتقدمة" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F5F5F7] text-sm outline-none" />
              </div>
              <div>
                <label class="block text-xs font-semibold mb-1">اسم الوحدة التعليمية</label>
                <input type="text" id="l-unit" required value="${lec ? lec.unit : 'الوحدة الأولى'}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F5F5F7] text-sm outline-none" />
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div class="sm:col-span-2">
                <label class="block text-xs font-semibold mb-1">رابط الفيديو المستضاف (MP4)</label>
                <input type="url" id="l-video" required value="${lec ? lec.videoUrl : SAMPLE_VIDEOS[0].url}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F5F5F7] text-xs font-mono outline-none" />
              </div>
              <div>
                <label class="block text-xs font-semibold mb-1">مدة المحاضرة</label>
                <input type="text" id="l-duration" required value="${lec ? lec.duration : '14:00'}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F5F5F7] text-sm outline-none" />
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold mb-1">اسم ملف الـ PDF المرفق (مادة تعليمية)</label>
              <input type="text" id="l-pdf" value="${lec ? lec.pdfName : 'ملخص_المحاضرة_PDF.pdf'}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F5F5F7] text-sm outline-none" />
            </div>

            <div>
              <label class="block text-xs font-semibold mb-1">ملاحظات وشرح المحاضرة</label>
              <textarea id="l-notes" rows="2" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F5F5F7] text-sm outline-none">${lec ? lec.notes : ''}</textarea>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold mb-1">فصول الفيديو Chapters (الثانية|العنوان)</label>
                <textarea id="l-chapters" rows="3" class="w-full px-3 py-2 rounded-xl bg-[#F5F5F7] text-xs font-mono outline-none">${chaptersText}</textarea>
              </div>
              <div>
                <label class="block text-xs font-semibold mb-1">اللحظات المهمة Moments (الثانية|الوصف)</label>
                <textarea id="l-moments" rows="3" class="w-full px-3 py-2 rounded-xl bg-[#F5F5F7] text-xs font-mono outline-none">${momentsText}</textarea>
              </div>
            </div>

            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-[#F5F5F7] text-xs font-bold">إلغاء</button>
              <button type="submit" class="px-5 py-2.5 rounded-xl bg-[#0071E3] text-white text-xs font-bold">حفظ المحاضرة</button>
            </div>
          </form>
        </div>
      `);
    }

    function parseTimelineLines(raw, keyName) {
      return raw.split('\n').map(line => line.trim()).filter(Boolean).map(line => {
        const [sec, ...rest] = line.split('|');
        return {
          time: parseInt(sec, 10) || 0,
          [keyName]: rest.join('|').trim() || 'نقطة زمنية'
        };
      });
    }

    function saveLectureForm(e, courseId, lectureId) {
      e.preventDefault();
      const course = db.courses.find(c => c.id === courseId);
      if (!course) return;

      const data = {
        title: document.getElementById('l-title').value.trim(),
        unit: document.getElementById('l-unit').value.trim(),
        videoUrl: document.getElementById('l-video').value.trim(),
        duration: document.getElementById('l-duration').value.trim(),
        pdfName: document.getElementById('l-pdf').value.trim(),
        pdfUrl: '#pdf-attachment',
        notes: document.getElementById('l-notes').value.trim(),
        chapters: parseTimelineLines(document.getElementById('l-chapters').value, 'title'),
        moments: parseTimelineLines(document.getElementById('l-moments').value, 'label')
      };

      if (lectureId) {
        const lec = course.lectures.find(l => l.id === lectureId);
        if (lec) Object.assign(lec, data);
        showToast('تم تحديث المحاضرة بنجاح', 'success');
      } else {
        course.lectures.push({
          id: 'lec-' + Date.now(),
          ...data,
          exam: null
        });
        showToast('تمت إضافة المحاضرة الجديدة للكورس', 'success');
      }

      saveDB();
      closeModal();
      renderTeacherDashboard();
    }

    // Exam Builder Modal (MCQ + Essay + Gate Next Lecture)
    let tempExamQuestions = [];

    function openExamBuilderModal(courseId, lectureId) {
      const course = db.courses.find(c => c.id === courseId);
      const lec = course ? course.lectures.find(l => l.id === lectureId) : null;
      if (!lec) return;

      tempExamQuestions = lec.exam ? JSON.parse(JSON.stringify(lec.exam.questions)) : [
        {
          id: 'q-' + Date.now(),
          type: 'mcq',
          text: '',
          options: ['', '', '', ''],
          correctIndex: 0
        }
      ];

      renderExamBuilderUI(courseId, lectureId, lec);
    }

    function renderExamBuilderUI(courseId, lectureId, lec) {
      const existingExam = lec.exam;
      openModal(`
        <div class="p-6 max-h-[88vh] overflow-y-auto">
          <div class="flex items-center justify-between pb-4 border-b border-black/5">
            <div>
              <h3 class="font-display font-bold text-lg">منشئ الامتحانات التفاعلي</h3>
              <p class="text-xs text-[#6E6E73]">المحاضرة: ${lec.title}</p>
            </div>
            <button onclick="closeModal()" class="p-1.5 rounded-lg hover:bg-black/5"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>

          <div class="space-y-4 mt-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold mb-1">عنوان الامتحان</label>
                <input type="text" id="ex-title" value="${existingExam ? existingExam.title : 'اختبار تقييم: ' + lec.title}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F5F5F7] text-sm outline-none" />
              </div>
              <div>
                <label class="block text-xs font-semibold mb-1">نسبة النجاح المطلوبة (%)</label>
                <input type="number" id="ex-pass" min="10" max="100" value="${existingExam ? existingExam.passScore : 70}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F5F5F7] text-sm outline-none" />
              </div>
            </div>

            <label class="flex items-center gap-2.5 p-3.5 rounded-2xl bg-amber-50 border border-amber-200/60 text-xs font-semibold text-amber-900 cursor-pointer">
              <input type="checkbox" id="ex-gate" ${!existingExam || existingExam.requirePassToUnlockNext ? 'checked' : ''} class="w-4 h-4 accent-[#0071E3]" />
              <span>اشتراط اجتياز هذا الامتحان لفتح المحاضرة التالية للطالب (Content Locking)</span>
            </label>

            <div id="exam-questions-list" class="space-y-4">
              ${tempExamQuestions.map((q, idx) => `
                <div class="p-4 rounded-2xl bg-[#F5F5F7] border border-black/5 space-y-3">
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-[#0071E3]">سؤال ${idx + 1} (${q.type === 'mcq' ? 'اختيار من متعدد' : 'سؤال مقالي'})</span>
                    <button type="button" onclick="removeTempQuestion(${idx}, '${courseId}', '${lectureId}')" class="text-xs text-rose-600 hover:underline">حذف</button>
                  </div>
                  <input type="text" oninput="tempExamQuestions[${idx}].text = this.value" value="${q.text}" placeholder="اكتب نص السؤال هنا..." class="w-full px-3 py-2 rounded-xl bg-white text-sm outline-none" />
                  ${q.type === 'mcq' ? `
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      ${[0,1,2,3].map(optIdx => `
                        <div class="flex items-center gap-2 bg-white px-2.5 py-1.5 rounded-xl border ${q.correctIndex === optIdx ? 'border-emerald-500' : 'border-transparent'}">
                          <input type="radio" name="correct-${idx}" ${q.correctIndex === optIdx ? 'checked' : ''} onchange="tempExamQuestions[${idx}].correctIndex = ${optIdx}" />
                          <input type="text" oninput="tempExamQuestions[${idx}].options[${optIdx}] = this.value" value="${q.options[optIdx] || ''}" placeholder="${optIdx === 0 ? 'الإجابة الصحيحة' : 'خيار خاطئ ' + optIdx}" class="w-full text-xs outline-none" />
                        </div>
                      `).join('')}
                    </div>
                  ` : `<p class="text-[11px] text-[#6E6E73]">سيظهر للطالب مربع نصي لكتابة إجابته المقالية وتُرسل للمدرس للتصحيح.</p>`}
                </div>
              `).join('')}
            </div>

            <div class="flex flex-wrap gap-2">
              <button type="button" onclick="addTempQuestion('mcq', '${courseId}', '${lectureId}')" class="px-3.5 py-2 rounded-xl bg-blue-50 text-[#0071E3] text-xs font-bold hover:bg-blue-100">
                + إضافة سؤال اختيار من متعدد (MCQ)
              </button>
              <button type="button" onclick="addTempQuestion('essay', '${courseId}', '${lectureId}')" class="px-3.5 py-2 rounded-xl bg-purple-50 text-purple-700 text-xs font-bold hover:bg-purple-100">
                + إضافة سؤال مقالي (Essay)
              </button>
            </div>

            <div class="flex justify-end gap-2 pt-3 border-t border-black/5">
              <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-[#F5F5F7] text-xs font-bold">إلغاء</button>
              <button type="button" onclick="saveExamBuilder('${courseId}', '${lectureId}')" class="px-5 py-2.5 rounded-xl bg-[#34C759] text-white text-xs font-bold">حفظ واعتماد الامتحان</button>
            </div>
          </div>
        </div>
      `);
    }

    function addTempQuestion(type, courseId, lectureId) {
      const course = db.courses.find(c => c.id === courseId);
      const lec = course.lectures.find(l => l.id === lectureId);
      tempExamQuestions.push(type === 'mcq'
        ? { id: 'q-' + Date.now(), type: 'mcq', text: '', options: ['', '', '', ''], correctIndex: 0 }
        : { id: 'q-' + Date.now(), type: 'essay', text: '' }
      );
      renderExamBuilderUI(courseId, lectureId, lec);
    }

    function removeTempQuestion(idx, courseId, lectureId) {
      const course = db.courses.find(c => c.id === courseId);
      const lec = course.lectures.find(l => l.id === lectureId);
      tempExamQuestions.splice(idx, 1);
      renderExamBuilderUI(courseId, lectureId, lec);
    }

    function saveExamBuilder(courseId, lectureId) {
      const course = db.courses.find(c => c.id === courseId);
      const lec = course.lectures.find(l => l.id === lectureId);
      const validQuestions = tempExamQuestions.filter(q => q.text.trim() !== '');
      if (validQuestions.length === 0) {
        showToast('يرجى إضافة سؤال واحد على الأقل بنص صحيح', 'error');
        return;
      }
      lec.exam = {
        id: lec.exam ? lec.exam.id : 'ex-' + Date.now(),
        title: document.getElementById('ex-title').value.trim() || 'امتحان المحاضرة',
        passScore: parseInt(document.getElementById('ex-pass').value, 10) || 60,
        requirePassToUnlockNext: document.getElementById('ex-gate').checked,
        questions: validQuestions
      };
      saveDB();
      closeModal();
      showToast('تم حفظ الامتحان وربطه بالمحاضرة بنجاح!', 'success');
      renderTeacherDashboard();
    }

    function gradeEssaySubmission(subId, essayIdx) {
      const sub = db.examSubmissions.find(s => s.id === subId);
      if (!sub) return;
      const val = parseInt(document.getElementById(`grade-${subId}-${essayIdx}`).value, 10) || 0;
      sub.essayAnswers[essayIdx].teacherGrade = Math.min(100, Math.max(0, val));
      sub.essayAnswers[essayIdx].graded = true;
      sub.totalScore = Math.round((sub.mcqScore + sub.essayAnswers[essayIdx].teacherGrade) / 2);
      saveDB();
      showToast('تم اعتماد درجة السؤال المقالي وتحديث النتيجة النهائية', 'success');
      renderTeacherDashboard();
    }

    // =========================================================================
    // 6. STUDENT DASHBOARD, CUSTOM VIDEO PLAYER & EXAM ENGINE
    // =========================================================================
    function isStudentEnrolled(courseId) {
      return db.enrollments.some(e => e.userId === currentUser.id && e.courseId === courseId);
    }

    function getStudentEnrollment(courseId) {
      return db.enrollments.find(e => e.userId === currentUser.id && e.courseId === courseId);
    }

    function isLectureUnlocked(course, lectureIndex) {
      if (lectureIndex === 0) return true;
      const prevLecture = course.lectures[lectureIndex - 1];
      if (!prevLecture || !prevLecture.exam || !prevLecture.exam.requirePassToUnlockNext) {
        return true;
      }
      // Check if student passed prevLecture's exam
      const passedSub = db.examSubmissions.find(s =>
        s.userId === currentUser.id &&
        s.courseId === course.id &&
        s.lectureId === prevLecture.id &&
        s.passed === true
      );
      return Boolean(passedSub);
    }

    function renderStudentDashboard() {
      if (!enforceRLS('student')) return;
      const app = document.getElementById('app-container');

      if (studentTab === 'player' && activeCourseId) {
        renderStudentCoursePlayer();
        return;
      }

      const publishedCourses = db.courses.filter(c => c.published);
      const filteredCourses = publishedCourses.filter(c => {
        if (studentCourseFilter === 'enrolled') return isStudentEnrolled(c.id);
        if (studentCourseFilter === 'free') return c.isFree;
        if (studentCourseFilter === 'paid') return !c.isFree;
        return true;
      });

      const mySubmissions = db.examSubmissions.filter(s => s.userId === currentUser.id);

      let mainSection = '';

      if (studentTab === 'catalog') {
        mainSection = `
          <!-- Filter Bar -->
          <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
            <div class="segmented-bg inline-flex flex-wrap gap-1">
              <button onclick="studentCourseFilter='all'; renderStudentDashboard();" class="px-3.5 py-2 rounded-xl text-xs font-bold transition ${studentCourseFilter==='all' ? 'bg-white text-[#1D1D1F] shadow-sm' : 'text-[#6E6E73]'}">جميع الكورسات</button>
              <button onclick="studentCourseFilter='enrolled'; renderStudentDashboard();" class="px-3.5 py-2 rounded-xl text-xs font-bold transition ${studentCourseFilter==='enrolled' ? 'bg-white text-[#1D1D1F] shadow-sm' : 'text-[#6E6E73]'}">كورساتي المشترك بها</button>
              <button onclick="studentCourseFilter='free'; renderStudentDashboard();" class="px-3.5 py-2 rounded-xl text-xs font-bold transition ${studentCourseFilter==='free' ? 'bg-white text-[#1D1D1F] shadow-sm' : 'text-[#6E6E73]'}">المجانية</button>
              <button onclick="studentCourseFilter='paid'; renderStudentDashboard();" class="px-3.5 py-2 rounded-xl text-xs font-bold transition ${studentCourseFilter==='paid' ? 'bg-white text-[#1D1D1F] shadow-sm' : 'text-[#6E6E73]'}">المتاحة بكود اشتراك</button>
            </div>

            <button onclick="openRedeemCodeModal()" class="px-4 py-2.5 rounded-xl bg-[#1D1D1F] hover:bg-black text-white text-xs font-semibold flex items-center gap-2 shadow-sm transition">
              <i data-lucide="key" class="w-4 h-4 text-amber-400"></i>
              تفعيل كود اشتراك
            </button>
          </div>

          <!-- Course Cards Grid -->
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            ${filteredCourses.map(course => {
              const teacher = db.users.find(u => u.id === course.teacherId);
              const enrolled = isStudentEnrolled(course.id);
              const enrollment = getStudentEnrollment(course.id);

        </div>
      `);
    }

    function submitRedeemCode(e, targetCourseId) {
      e.preventDefault();
      const inputCode = document.getElementById('redeem-code-input').value.trim().toUpperCase();
      const codeObj = db.subscriptionCodes.find(sc => sc.code.toUpperCase() === inputCode);

      if (!codeObj) {
        showToast('كود الاشتراك غير صحيح. يرجى التأكد من كتابته بشكل سليم.', 'error');
        return;
      }
      if (codeObj.used) {
        showToast('عذراً، هذا الكود تم استخدامه مسبقًا!', 'error');
        return;
      }
      if (targetCourseId && codeObj.courseId !== targetCourseId) {
        const actualCourse = db.courses.find(c => c.id === codeObj.courseId);
        showToast(`هذا الكود مخصص لكورس آخر: ${actualCourse ? actualCourse.title : ''}`, 'error');
        return;
      }

      // Mark code as redeemed
      codeObj.used = true;
      codeObj.usedByUserId = currentUser.id;
      codeObj.usedAt = new Date().toLocaleString('ar-EG');

      if (!isStudentEnrolled(codeObj.courseId)) {
        db.enrollments.push({
          userId: currentUser.id,
          courseId: codeObj.courseId,
          enrolledAt: new Date().toISOString().slice(0, 10),
          method: `code: ${codeObj.code}`,
          completedLectures: []
        });
      }

      saveDB();
      closeModal();
      showToast('تم تفعيل الكود وفتح الكورس بنجاح!', 'success');
      enterCoursePlayer(codeObj.courseId);
    }

    function enterCoursePlayer(courseId) {
      const course = db.courses.find(c => c.id === courseId);

      activeCourseId = courseId;
      activeLectureId = course.lectures.length > 0 ? course.lectures[0].id : null;
      activeExamMode = false;
      studentTab = 'player';
      renderStudentCoursePlayer();
    }

                  ${course.lectures.map((lec, idx) => {
                    const unlocked = isLectureUnlocked(course, idx);
                    const isActive = currentLecture && lec.id === currentLecture.id;
                    const isDone = enrollment && enrollment.completedLectures.includes(lec.id);

                    return `
                      <button
                        onclick="${unlocked ? `activeLectureId='${lec.id}'; activeExamMode=false; renderStudentCoursePlayer();` : `showToast('هذه المحاضرة مغلقة! يجب اجتياز امتحان المحاضرة السابقة أولاً.', 'error');`}"
                        class="w-full p-3.5 rounded-2xl text-right transition flex items-start gap-3 border ${
                          isActive
                            ? 'bg-blue-50/80 border-[#0071E3]/40'
                            : unlocked
                              ? 'bg-[#F5F5F7] hover:bg-gray-200/70 border-transparent'
                              : 'bg-gray-100/70 opacity-65 border-transparent cursor-not-allowed'
                        }">
                        <div class="w-8 h-8 rounded-xl flex items-center justify-center shrink-0 mt-0.5 ${
                          !unlocked
                            ? 'bg-gray-200 text-gray-500'
                            : isDone
                              ? 'bg-emerald-500 text-white'
                              : isActive
                                ? 'bg-[#0071E3] text-white'
                                : 'bg-white text-[#1D1D1F]'
                        }">
                          ${!unlocked
                            ? '<i data-lucide="lock" class="w-4 h-4"></i>'
                            : isDone
                              ? '<i data-lucide="check" class="w-4 h-4"></i>'
                              : '<i data-lucide="play" class="w-3.5 h-3.5"></i>'
                          }
                        </div>
                        <div class="flex-1 min-w-0">
                          <div class="text-[11px] text-[#6E6E73] font-medium">${lec.unit}</div>
                          <div class="text-xs font-bold text-[#1D1D1F] mt-0.5 line-clamp-2">${lec.title}</div>
                          <div class="flex items-center gap-2 mt-1.5 text-[11px] text-[#6E6E73]">
                            <span>${lec.duration}</span>
                            ${lec.exam ? `<span class="text-[#0071E3] font-semibold">• يتضمن امتحان</span>` : ''}
                          </div>
                        </div>
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    // Video Player Control Functions
    function formatSeconds(sec) {
      const s = Math.floor(sec || 0);
      const mins = Math.floor(s / 60);
      const rem = s % 60;
      return `${String(mins).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
    }

    function initVideoMetadata() {
      const video = document.getElementById('custom-video');
      if (!video) return;
      updateVideoProgress();
      renderTimelineMarkers();
    }

    function renderTimelineMarkers() {
      const video = document.getElementById('custom-video');
      const markersBox = document.getElementById('timeline-markers');
      const course = db.courses.find(c => c.id === activeCourseId);
      const lec = course ? course.lectures.find(l => l.id === activeLectureId) : null;
      if (!video || !markersBox || !lec || !video.duration) return;

      const dur = video.duration;
      const chapterPins = (lec.chapters || []).map(ch => {
        const pct = Math.min(98, Math.max(0, (ch.time / dur) * 100));
        return `<span style="right: ${pct}%" class="absolute w-1.5 h-2.5 bg-sky-400 rounded-full -top-0.5" title="${ch.title}"></span>`;
      }).join('');

      const momentPins = (lec.moments || []).map(m => {
        const pct = Math.min(98, Math.max(0, (m.time / dur) * 100));
        return `<span style="right: ${pct}%" class="absolute w-2 h-2 bg-amber-400 rotate-45 -top-0.5" title="${m.label}"></span>`;
      }).join('');

      markersBox.innerHTML = chapterPins + momentPins;
    }

    function togglePlayPause() {
      const video = document.getElementById('custom-video');
      const icon = document.getElementById('play-pause-icon');
      if (!video) return;
      if (video.paused) {
        video.play();
        icon.setAttribute('data-lucide', 'pause');
      } else {
        video.pause();
        icon.setAttribute('data-lucide', 'play');
      }
      lucide.createIcons();
    }

    function skipVideo(delta) {
      const video = document.getElementById('custom-video');
      if (!video) return;
      video.currentTime = Math.max(0, Math.min(video.duration || 0, video.currentTime + delta));
    }

    function seekVideoToPercent(pct) {
      const video = document.getElementById('custom-video');
      if (!video || !video.duration) return;
      video.currentTime = (pct / 100) * video.duration;
    }

    function seekVideoToSeconds(sec) {
      const video = document.getElementById('custom-video');
      if (!video) return;
      video.currentTime = sec;
      video.play();
      const icon = document.getElementById('play-pause-icon');
      if (icon) {
        icon.setAttribute('data-lucide', 'pause');
        lucide.createIcons();
      }
    }

    function updateVideoProgress() {
      const video = document.getElementById('custom-video');
      const seekBar = document.getElementById('video-seek-bar');
      const timeDisplay = document.getElementById('video-time-display');
      if (!video || !seekBar || !timeDisplay) return;

      const dur = video.duration || 0;
      const cur = video.currentTime || 0;
      const pct = dur > 0 ? (cur / dur) * 100 : 0;
      seekBar.value = pct;
      seekBar.style.background = `linear-gradient(to left, #0071E3 ${pct}%, rgba(255,255,255,0.28) ${pct}%)`;
      timeDisplay.textContent = `${formatSeconds(cur)} / ${formatSeconds(dur)}`;
    }

    function changeVideoVolume(val) {
      const video = document.getElementById('custom-video');
      if (!video) return;
      video.volume = val;
      video.muted = Number(val) === 0;
    }

    function toggleMuteVideo() {
      const video = document.getElementById('custom-video');
      const icon = document.getElementById('mute-icon');
      if (!video) return;
      video.muted = !video.muted;
      icon.setAttribute('data-lucide', video.muted ? 'volume-x' : 'volume-2');
      lucide.createIcons();
    }

    function changeVideoSpeed(rate) {
      const video = document.getElementById('custom-video');
      if (!video) return;
      video.playbackRate = parseFloat(rate);
      showToast(`سرعة التشغيل: ${rate}x`, 'info');
    }

    function changeVideoQuality(q) {
      showToast(`تم ضبط جودة البث على ${q}`, 'info');
    }

    function toggleFloatingPlayer() {
      isPiP = !isPiP;
      const wrapper = document.getElementById('player-wrapper');
      if (wrapper) {
        wrapper.classList.toggle('pip-active', isPiP);
        showToast(isPiP ? 'تم تفعيل وضع النافذة العائمة' : 'تمت استعادة حجم المشغل الطبيعي', 'info');
      }
    }

    function toggleVideoFullscreen() {
      const wrapper = document.getElementById('player-wrapper');
      if (!wrapper) return;
      if (!document.fullscreenElement) {
        wrapper.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function handleVideoEnded(courseId, lectureId) {
      const enrollment = getStudentEnrollment(courseId);
      if (enrollment && !enrollment.completedLectures.includes(lectureId)) {
        enrollment.completedLectures.push(lectureId);
        saveDB();
        showToast('أحسنت! أتممت مشاهدة المحاضرة بنجاح.', 'success');
      }
    }

    function downloadLecturePDF(filename, lectureTitle) {
      const content = `منصة أُفُق التعليمية\nملخص المحاضرة: ${lectureTitle}\nاسم الملف: ${filename}\nتاريخ التحميل: ${new Date().toLocaleDateString('ar-EG')}`;
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename.replace('.pdf', '.txt');
      a.click();
      URL.revokeObjectURL(url);
      showToast(`جاري تحميل المادة التعليمية: ${filename}`, 'success');
    }

    // Interactive Exam Rendering & Auto-Grading
    function renderInteractiveExamBox(course, lecture) {
      const exam = lecture.exam;
      return `
        <div class="apple-card p-6 sm:p-8 animate-view">
          <div class="flex items-center justify-between pb-4 mb-6 border-b border-black/5">
            <div>
              <span class="px-2.5 py-1 rounded-lg bg-blue-50 text-[#0071E3] text-xs font-bold">تقييم المحاضرة</span>
              <h2 class="font-display font-extrabold text-xl text-[#1D1D1F] mt-1.5">${exam.title}</h2>
              <p class="text-xs text-[#6E6E73] mt-0.5">درجة الاجتياز المطلوبة: ${exam.passScore}%</p>
            </div>
            <button onclick="activeExamMode=false; renderStudentCoursePlayer();" class="px-3.5 py-2 rounded-xl bg-[#F5F5F7] text-xs font-bold">
              العودة للفيديو
            </button>
          </div>

          <form onsubmit="submitStudentExam(event, '${course.id}', '${lecture.id}')" class="space-y-6">
            ${exam.questions.map((q, idx) => `
              <div class="p-5 rounded-2xl bg-[#F5F5F7] space-y-3">
                <div class="font-bold text-sm text-[#1D1D1F]">
                  <span class="text-[#0071E3] ml-1">${idx + 1}.</span> ${q.text}
                </div>
                ${q.type === 'mcq' ? `
                  <div class="space-y-2">
                    ${q.options.map((opt, optIdx) => `
                      <label class="flex items-center gap-3 p-3 rounded-xl bg-white hover:bg-blue-50/60 cursor-pointer border border-transparent has-[:checked]:border-[#0071E3] transition text-xs font-medium">
                        <input type="radio" name="ans-${q.id}" value="${optIdx}" required class="w-4 h-4 accent-[#0071E3]" />
                        <span>${opt}</span>
                      </label>
                    `).join('')}
                  </div>
                ` : `
                  <textarea id="essay-ans-${q.id}" rows="3" required placeholder="اكتب إجابتك المقالية بوضوح هنا..."
                    class="w-full p-3.5 rounded-xl bg-white text-sm outline-none focus:border-[#0071E3] border border-transparent"></textarea>
                `}
              </div>
            `).join('')}

            <button type="submit" class="w-full py-3.5 rounded-xl bg-[#34C759] hover:opacity-95 text-white font-bold text-sm shadow-sm transition">
              تسليم الإجابات وعرض النتيجة الفورية
            </button>
          </form>
        </div>
      `;
    }

    function submitStudentExam(e, courseId, lectureId) {
      e.preventDefault();
      const course = db.courses.find(c => c.id === courseId);
      const lecture = course.lectures.find(l => l.id === lectureId);
      const exam = lecture.exam;

      const mcqQuestions = exam.questions.filter(q => q.type === 'mcq');
      const essayQuestions = exam.questions.filter(q => q.type === 'essay');

      let correctMcq = 0;
      mcqQuestions.forEach(q => {
        const selected = document.querySelector(`input[name="ans-${q.id}"]:checked`);
        if (selected && parseInt(selected.value, 10) === q.correctIndex) {
          correctMcq++;
        }
      });

      const mcqScore = mcqQuestions.length > 0 ? Math.round((correctMcq / mcqQuestions.length) * 100) : 100;

      const essayAnswers = essayQuestions.map(q => ({
        questionId: q.id,
        questionText: q.text,
        studentAnswer: document.getElementById(`essay-ans-${q.id}`)?.value.trim() || '',
        teacherGrade: null,
        graded: false
      }));

      const passed = mcqScore >= exam.passScore;

      // Save submission
      db.examSubmissions.unshift({
        id: 'sub-' + Date.now(),
        userId: currentUser.id,
        courseId,
        lectureId,
        examId: exam.id,
        mcqScore,
        totalScore: mcqScore,
        passed,
        essayAnswers,
        submittedAt: new Date().toLocaleString('ar-EG')
      });

      // Mark lecture completed if passed
      const enrollment = getStudentEnrollment(courseId);
      if (passed && enrollment && !enrollment.completedLectures.includes(lectureId)) {
        enrollment.completedLectures.push(lectureId);
      }

      saveDB();
      activeExamMode = false;

      // Show Instant Result Modal
      openModal(`
        <div class="p-7 text-center">
          <div class="w-16 h-16 mx-auto rounded-full ${passed ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'} flex items-center justify-center mb-4">
            <i data-lucide="${passed ? 'award' : 'x-circle'}" class="w-9 h-9"></i>
          </div>
          <h3 class="font-display font-extrabold text-2xl text-[#1D1D1F]">
            ${passed ? 'تهانينا! لقد اجتزت الامتحان بنجاح' : 'لم تحقق درجة الاجتياز المطلوبة'}
          </h3>
          <div class="text-4xl font-display font-extrabold my-3 ${passed ? 'text-emerald-600' : 'text-rose-600'}">
            ${mcqScore}%
          </div>
          <p class="text-xs text-[#6E6E73] max-w-md mx-auto leading-relaxed">
            ${passed
              ? 'تم تسجيل نتيجتك وفتح المحاضرة التالية في الكورس تلقائياً!'
              : `درجة الاجتياز المطلوبة هي ${exam.passScore}%. يمكنك مراجعة المحاضرة وإعادة المحاولة.`
            }
            ${essayAnswers.length > 0 ? '<br>تم إرسال إجاباتك المقالية إلى المدرس للمراجعة والتقييم.' : ''}
          </p>
          <button onclick="closeModal(); renderStudentCoursePlayer();" class="mt-6 px-6 py-3 rounded-xl bg-[#0071E3] text-white text-xs font-bold">
            متابعة التعلم
          </button>
        </div>
      `);
    }

    // =========================================================================
    // 8. MAIN APPLICATION ROUTER & INITIALIZATION
    // =========================================================================
    function renderApp() {
      if (!currentUser) {
        renderAuthScreen();
        return;
      }

      // Update Header
      const header = document.getElementById('main-header');
      header.classList.remove('hidden');

      const roleBadges = {
        admin: 'لوحة الإدارة',
        teacher: 'حساب مدرس',
        student: 'حساب طالب'
      };

      document.getElementById('header-role-badge').textContent = roleBadges[currentUser.role] || '';
      document.getElementById('header-user-name').textContent = currentUser.name;
      document.getElementById('header-user-email').textContent = currentUser.email;
      document.getElementById('header-user-avatar').textContent = currentUser.name.charAt(0);

      // Highlight Quick Switcher button
      ['admin', 'teacher', 'student'].forEach(r => {
        const btn = document.getElementById('qs-' + r);
        if (btn) {
          btn.classList.toggle('ring-2', currentUser.role === r);
          btn.classList.toggle('ring-white/60', currentUser.role === r);
        }
      });

      if (currentUser.role === 'admin') {
        renderAdminDashboard();
      } else if (currentUser.role === 'teacher') {
        renderTeacherDashboard();
      } else {
        renderStudentDashboard();
      }
    }

    // Boot Application
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
